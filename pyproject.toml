[project]
name = "gpt-rag-orchestrator"
version = "0.1.0"
description = "Agent Landing Zone Orchestrator"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core==1.24.0",
    "agent-framework-foundry==1.16.0",
    "azure-identity==1.25.3",
    "azure-appconfiguration-provider==2.3.1",
    "azure-monitor-opentelemetry==1.8.11",
]

[project.optional-dependencies]
hosted = ["agent-framework-foundry-hosting==1.0.0b261030"]
container-apps = [
    "agent-framework-durabletask==1.0.0b261029",
    "durabletask==1.12.0", "durabletask-azuremanaged==1.12.0",
]
tools = [
    "azure-cosmos==4.5.1", "azure-keyvault-secrets==4.11.2",
    "azure-search-documents==11.7.0b2", "azure-storage-blob==12.25.1",
    "fastapi==0.162.0", "PyJWT==2.15.0",
    "tiktoken==0.14.0",
    "requests==2.34.2", "jinja2==3.1.6", "tenacity==9.1.4",
    "mcp==2.3.0", "httpx2==2.16.0",
]
test = [
    "jsonschema>=4.23.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"VERSION" = "native/VERSION"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
required-version = "==0.16.5"

[tool.ruff.lint]
select = ["E722", "BLE001", "PGH003", "PGH004", "RUF100", "F821", "F822", "F823"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
check_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_unused_configs = true
show_error_codes = true
follow_imports = "normal"

[[tool.mypy.overrides]]
module = ["schemas", "connectors.obo", "plugins.retrieval.retrieval_types"]
disallow_untyped_defs = true
