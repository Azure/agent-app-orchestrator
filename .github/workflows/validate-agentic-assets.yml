name: Validate Copilot engineering assets

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/copilot-instructions.md"
      - ".github/agents/**"
      - ".github/skills/**"
      - ".github/instructions/**"
      - ".github/scripts/validate-agentic-assets.py"
      - ".github/scripts/requirements.txt"
      - ".github/workflows/validate-agentic-assets.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "AGENTS.md"
      - ".github/copilot-instructions.md"
      - ".github/agents/**"
      - ".github/skills/**"
      - ".github/instructions/**"
      - ".github/scripts/validate-agentic-assets.py"
      - ".github/scripts/requirements.txt"
      - ".github/workflows/validate-agentic-assets.yml"

permissions:
  contents: read

jobs:
  validate:
    name: frontmatter and links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/scripts/requirements.txt

      - name: Install pinned validator dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r .github/scripts/requirements.txt

      - name: Validate agents, skills, and scoped instructions
        run: python .github/scripts/validate-agentic-assets.py
